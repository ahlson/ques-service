name: Docker image

# 构建纯 Docker 镜像并推送到 Docker Hub
# 触发方式：
#   1) 手动：Actions → Docker image → Run workflow（可填标签，默认 v4）
#   2) 打 tag：git tag v4 && git push --tags
#
# 需要的仓库 Secret：DOCKERHUB_TOKEN（Docker Hub 的 Access Token，不是登录密码）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签'
        required: true
        default: 'v4'
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ahlson
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ahlson/ques-service:${{ github.event.inputs.tag || github.ref_name }}
            ahlson/ques-service:latest
