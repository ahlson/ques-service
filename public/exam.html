<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>模拟考试 - 在线答题系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="app">
  <div class="page-title">模拟考试 <small>随机组卷 · 限时作答 · 自动判分</small></div>

  <!-- 阶段一：设置 -->
  <div class="card" id="phase-setup">
    <div class="help-block">
      规则说明：试卷由<b>单选、多选、判断</b>三类题随机抽取组成，<b>每题限时 1 分半</b>（总时长 = 题数 × 1.5 分钟），
      考试期间不显示对错，交卷后统一判分并生成成绩单。
    </div>
    <div class="form-item">
      <label>各题型题量</label>
      <div class="chips" id="preset-chips"></div>
    </div>
    <div class="form-item">
      <label></label>
      <div class="flex wrap" style="gap:12px">
        <label class="flex" style="gap:6px;align-items:center">单选题
          <input type="number" id="cnt-single" min="0" max="500" value="40" style="max-width:100px"> 题</label>
        <label class="flex" style="gap:6px;align-items:center">多选题
          <input type="number" id="cnt-multiple" min="0" max="500" value="30" style="max-width:100px"> 题</label>
        <label class="flex" style="gap:6px;align-items:center">判断题
          <input type="number" id="cnt-judge" min="0" max="500" value="30" style="max-width:100px"> 题</label>
      </div>
      <p style="font-size:13px;color:var(--text-3);margin-top:8px" id="bank-info"></p>
    </div>
    <div class="form-item">
      <label>出题顺序</label>
      <div class="chips" id="mode-chips">
        <button class="chip active" data-v="smart">未做过的优先（推荐）</button>
        <button class="chip" data-v="random">完全随机（旧版）</button>
      </div>
    </div>
    <div class="help-block" id="paper-summary"></div>
    <button class="btn" id="btn-start">开始考试</button>
  </div>

  <!-- 阶段二：考试中 -->
  <div id="phase-doing" style="display:none">
    <div class="exam-toolbar">
      <span class="timer" id="timer">--:--</span>
      <button class="btn btn-ghost btn-sm" id="btn-toggle-grid">答题卡</button>
      <button class="btn btn-danger btn-sm" id="btn-submit" style="margin-left:auto">交卷</button>
    </div>
    <div class="card" id="grid-panel" style="display:none;padding:12px 16px;max-height:40vh;overflow:auto">
      <div class="q-grid" id="q-grid"></div>
    </div>
    <div class="card">
      <div class="q-head" id="q-head"></div>
      <div class="q-stem" id="q-stem"></div>
      <div class="opts" id="q-opts"></div>
      <div class="flex right mt16">
        <button class="btn btn-ghost" id="btn-prev">← 上一题</button>
        <button class="btn" id="btn-next">下一题 →</button>
      </div>
    </div>
  </div>

  <!-- 阶段三：成绩 -->
  <div id="phase-result" style="display:none">
    <div class="card score-hero">
      <div class="score" id="r-score">--</div>
      <div class="sub" id="r-sub"></div>
    </div>
    <div class="flex" style="justify-content:center">
      <button class="btn btn-outline" onclick="location.reload()">再考一次</button>
      <a class="btn" id="r-detail-link" href="records.html">查看答题明细</a>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  Auth.requireStudent();
  renderHeader('exam');

  const state = {
    recordId: null, durationSec: 0,
    questions: [], index: 0,
    answers: {},           // questionId -> answer
    mode: 'smart',         // smart = 未做过的优先 / random = 完全随机
    deadline: 0, timer: null, submitted: false
  };

  document.getElementById('mode-chips').onclick = (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.mode = b.dataset.v;
    document.querySelectorAll('#mode-chips .chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  };

  /* ===== 阶段一：设置（按题型组卷，默认 40-30-30） ===== */
  const PRESETS = [
    { label: '标准卷 40-30-30', v: [40, 30, 30] },
    { label: '半套卷 20-15-15', v: [20, 15, 15] },
    { label: '小测验 10-10-10', v: [10, 10, 10] },
    { label: '单选专项 50-0-0', v: [50, 0, 0] }
  ];
  const inputs = ['single', 'multiple', 'judge'].map(t => document.getElementById('cnt-' + t));

  (async () => {
    // 预设快捷键
    document.getElementById('preset-chips').innerHTML = PRESETS.map((p, i) =>
      `<button class="chip ${i === 0 ? 'active' : ''}" data-v="${p.v.join(',')}">${p.label}</button>`).join('');
    document.getElementById('preset-chips').onclick = (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      b.dataset.v.split(',').forEach((v, i) => inputs[i].value = v);
      document.querySelectorAll('#preset-chips .chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      updateSummary();
    };
    inputs.forEach(inp => inp.addEventListener('input', () => {
      document.querySelectorAll('#preset-chips .chip').forEach(x => x.classList.remove('active'));
      updateSummary();
    }));
    // 题库现有题量提示
    try {
      const cats = await getJSON('/api/categories');
      const avail = { single: 0, multiple: 0, judge: 0 };
      cats.forEach(c => avail[c.type] = c.count);
      document.getElementById('bank-info').textContent =
        `题库现有：单选题 ${avail.single} 道 · 多选题 ${avail.multiple} 道 · 判断题 ${avail.judge} 道（超出部分按实际数量抽取）`;
    } catch (e) { /* 忽略 */ }
    updateSummary();
  })();

  function getCounts() {
    return inputs.map(inp => Math.max(0, Math.min(Math.floor(Number(inp.value) || 0), 500)));
  }

  function updateSummary() {
    const [s, m, j] = getCounts();
    const total = s + m + j;
    const el = document.getElementById('paper-summary');
    if (total === 0) { el.innerHTML = '请至少设置一个题型的题量'; return; }
    const mins = Math.round(total * 1.5);
    el.innerHTML = `本卷共 <b>${total}</b> 题（单选 ${s} · 多选 ${m} · 判断 ${j}），
      考试时长 <b>${mins} 分钟</b>（每题 1 分半）。`;
  }

  document.getElementById('btn-start').onclick = async () => {
    const [s, m, j] = getCounts();
    if (s + m + j === 0) { toast('请至少设置一个题型的题量', 'err'); return; }
    try {
      const r = await postJSON('/api/exam/start', { single: s, multiple: m, judge: j, mode: state.mode });
      state.recordId = r.recordId;
      state.durationSec = r.durationSec;
      state.questions = r.questions;
      state.answers = {};
      state.index = 0;
      state.deadline = Date.now() + r.durationSec * 1000;
      document.getElementById('phase-setup').style.display = 'none';
      document.getElementById('phase-doing').style.display = '';
      state.timer = setInterval(tick, 500);
      renderGrid();
      renderQuestion();
      if (r.notice && r.notice.length) toast(r.notice.join('；'), 'err');
    } catch (e) { toast(e.message, 'err'); }
  };

  function tick() {
    const left = Math.max(0, Math.round((state.deadline - Date.now()) / 1000));
    const el = document.getElementById('timer');
    el.textContent = fmtTime(left);
    el.classList.toggle('warn', left <= 60);
    if (left === 0 && !state.submitted) {
      toast('时间到，系统自动交卷', 'err');
      submit(true);
    }
  }

  /* ===== 题号导航（答题卡，点按钮展开/收起） ===== */
  document.getElementById('btn-toggle-grid').onclick = () => {
    const p = document.getElementById('grid-panel');
    p.style.display = p.style.display === 'none' ? '' : 'none';
  };

  function renderGrid() {
    document.getElementById('q-grid').innerHTML = state.questions.map((q, i) =>
      `<button data-i="${i}" class="${state.answers[q.id] ? 'answered' : ''} ${i === state.index ? 'current' : ''}">${i + 1}</button>`).join('');
    document.getElementById('q-grid').onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      state.index = Number(b.dataset.i);
      renderGrid(); renderQuestion();
    };
  }

  function renderQuestion() {
    const q = state.questions[state.index];
    document.getElementById('q-head').innerHTML =
      `<span class="tag tag-blue">${TYPE_NAME[q.type]}</span>
       <span class="tag">第 ${state.index + 1} / ${state.questions.length} 题</span>`;
    document.getElementById('q-stem').textContent = q.stem;
    document.getElementById('btn-prev').disabled = state.index === 0;
    document.getElementById('btn-next').textContent = state.index === state.questions.length - 1 ? '最后一题' : '下一题 →';

    const box = document.getElementById('q-opts');
    const cur = state.answers[q.id] || '';
    if (q.type === 'multiple') {
      box.innerHTML = q.options.map((o, i) => {
        const letter = String.fromCharCode(65 + i);
        return `<button class="opt ${cur.includes(letter) ? 'selected' : ''}" data-i="${i}">
          <span class="letter">${letter}</span><span>${esc(o)}</span></button>`;
      }).join('');
      box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const letter = String.fromCharCode(65 + Number(b.dataset.i));
        let sel = [...new Set([...cur])];
        sel = sel.includes(letter) ? sel.filter(x => x !== letter) : sel.concat(letter);
        state.answers[q.id] = sel.sort().join('');
        renderQuestion(); renderGrid();
      });
    } else {
      const options = q.type === 'judge' ? ['正确', '错误'] : q.options;
      box.innerHTML = options.map((o, i) => {
        const letter = q.type === 'judge' ? (i === 0 ? 'T' : 'F') : String.fromCharCode(65 + i);
        return `<button class="opt ${cur === letter ? 'selected' : ''}" data-i="${i}">
          <span class="letter">${q.type === 'judge' ? (i === 0 ? '✓' : '✗') : letter}</span><span>${esc(o)}</span></button>`;
      }).join('');
      box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const i = Number(b.dataset.i);
        state.answers[q.id] = q.type === 'judge' ? (i === 0 ? 'T' : 'F') : String.fromCharCode(65 + i);
        renderQuestion(); renderGrid();
      });
    }
  }

  document.getElementById('btn-prev').onclick = () => { if (state.index > 0) { state.index--; renderGrid(); renderQuestion(); } };
  document.getElementById('btn-next').onclick = () => { if (state.index < state.questions.length - 1) { state.index++; renderGrid(); renderQuestion(); } };

  /* ===== 交卷 ===== */
  document.getElementById('btn-submit').onclick = () => {
    const unanswered = state.questions.filter(q => !state.answers[q.id]).length;
    const msg = unanswered > 0
      ? `还有 ${unanswered} 题未作答，确定交卷吗？未作答的题目按错误计分。`
      : '确定交卷吗？';
    if (confirmAction(msg)) submit(false);
  };

  async function submit(auto) {
    if (state.submitted) return;
    state.submitted = true;
    if (state.timer) clearInterval(state.timer);
    const answers = state.questions
      .filter(q => state.answers[q.id])
      .map(q => ({ questionId: q.id, answer: state.answers[q.id] }));
    try {
      const r = await postJSON('/api/exam/submit', { recordId: state.recordId, answers });
      document.getElementById('phase-doing').style.display = 'none';
      document.getElementById('r-score').textContent = r.score + ' 分';
      document.getElementById('r-sub').textContent =
        `共 ${r.total} 题 · 答对 ${r.correctCount} 题 · 作答 ${r.answered} 题${auto ? '（超时自动交卷）' : ''}`;
      document.getElementById('r-detail-link').href = `records.html?id=${r.recordId}`;
      document.getElementById('phase-result').style.display = '';
      window.scrollTo(0, 0);
    } catch (e) {
      state.submitted = false;
      state.timer = setInterval(tick, 500);
      toast(e.message, 'err');
    }
  }
})();
</script>
</body>
</html>
